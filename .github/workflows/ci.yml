name: ci

# Auto-check di tiap PR ke main + push langsung ke main.
# Goal: tidak ada regressi build/typecheck/lint/test bisa diam-diam masuk.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

# Cancel run lama saat ada push baru di branch yg sama -- hemat menit CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      # ESLint wajib bersih: package.json memakai --max-warnings=0.
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  backend:
    name: backend (lint + import + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install uv and locked dependencies
        run: |
          python -m pip install uv==0.12.9
          uv sync --frozen --extra dev

      # Audit #D-02: ruff sudah ada di dependency dev sejak lama tapi
      # tidak pernah dipanggil di CI.
      - name: Lint (ruff)
        run: uv run ruff check app tests

      - name: Import smoke test
        # Pastikan semua API & service module dpt di-import (syntax,
        # circular import, SQLAlchemy mapping error ketangkap di sini).
        run: |
          uv run python - <<'PY'
          import importlib, pkgutil
          import app.api.v1 as api_pkg
          import app.services as svc_pkg
          failed = []
          for pkg in (api_pkg, svc_pkg):
              for m in pkgutil.walk_packages(pkg.__path__, pkg.__name__ + "."):
                  try:
                      importlib.import_module(m.name)
                  except Exception as e:
                      failed.append(f"{m.name}: {type(e).__name__}: {e}")
          if failed:
              print("\n".join(failed))
              raise SystemExit(1)
          print("OK: all modules imported")
          PY

      - name: Run tests
        run: uv run pytest -q

  image:
    name: docker image (SPA + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Sejak penggabungan service (2026-06-13), Dockerfile di root yang
      # menentukan apakah deploy berhasil -- build-nya diuji di CI supaya
      # kegagalan ketahuan sebelum Railway, bukan sesudah.
      - name: Build image
        run: docker build -t bintang:ci .
