name: ci

# Auto-check di tiap PR ke main + push langsung ke main.
# Goal: tidak ada regressi build/typecheck/lint/test bisa diam-diam masuk.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel run lama saat ada push baru di branch yg sama -- hemat menit CI.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Audit 2026-06-13 #D-02: langkah ini DULU tidak menjalankan apa
      # pun -- eslint tidak terpasang, tidak ada berkas config, dan
      # `|| true` menelan kegagalannya. Sekarang lint benar-benar jalan
      # dan memblokir. Batas warning di-pin di package.json
      # (`--max-warnings=15`) sebagai ratchet: error apa pun langsung
      # gagal, warning baru juga gagal, tapi 15 warning lama yang ada
      # tidak memblokir sampai sempat dirapikan. Turunkan angkanya tiap
      # kali sebagian dibereskan.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: backend (lint + import + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Audit #D-02: ruff sudah ada di dependency dev sejak lama tapi
      # tidak pernah dipanggil di CI.
      - name: Lint (ruff)
        run: ruff check app tests

      - name: Import smoke test
        # Pastikan semua API & service module dpt di-import (syntax,
        # circular import, SQLAlchemy mapping error ketangkap di sini).
        run: |
          python - <<'PY'
          import importlib, pkgutil
          import app.api.v1 as api_pkg
          import app.services as svc_pkg
          failed = []
          for pkg in (api_pkg, svc_pkg):
              for m in pkgutil.walk_packages(pkg.__path__, pkg.__name__ + "."):
                  try:
                      importlib.import_module(m.name)
                  except Exception as e:
                      failed.append(f"{m.name}: {type(e).__name__}: {e}")
          if failed:
              print("\n".join(failed))
              raise SystemExit(1)
          print("OK: all modules imported")
          PY

      - name: Run tests
        run: pytest -q

  image:
    name: docker image (SPA + API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Sejak penggabungan service (2026-06-13), Dockerfile di root yang
      # menentukan apakah deploy berhasil -- build-nya diuji di CI supaya
      # kegagalan ketahuan sebelum Railway, bukan sesudah.
      - name: Build image
        run: docker build -t bintang:ci .

  # ── Bintang v3 (web/) ────────────────────────────────────────
  # Gerbang yang sama dengan MARLIN: typecheck · lint · unit · integrasi
  # (Postgres sungguhan) · `next build` · docker build. Jalan berdampingan
  # dengan job aplikasi lama sampai aplikasi lama dipensiunkan.
  web:
    name: web v3 (typecheck + lint + unit + integrasi + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bintang
          POSTGRES_PASSWORD: bintang
          POSTGRES_DB: bintang_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bintang"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bintang:bintang@localhost:5432/bintang_test
      SESSION_SECRET: ci-only-secret-0123456789abcdef-0123456789abcdef
      APP_ENV: test
      UPLOAD_DIR: /tmp/bintang-berkas
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit test
        run: pnpm vitest run tests/unit

      - name: Migrasi DB uji
        run: pnpm prisma migrate deploy

      - name: Integrasi (PostgreSQL)
        run: pnpm vitest run tests/integration

      - name: Build
        run: pnpm next build
        env:
          APP_ENV: production
          SESSION_SECRET: build-placeholder-secret-0123456789abcdef

  web-image:
    name: web v3 docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t bintang-web:ci web
